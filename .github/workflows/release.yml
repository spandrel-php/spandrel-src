name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  # box.phar release, pinned by checksum rather than an action so the exact
  # same binary this repo tested against in CI is the one that ships
  BOX_VERSION: "4.7.0"
  BOX_PHAR_SHA256: "3d390eeaec33288098fe83f8a54c60cc575cb6be295f38ff4482b4b4f26f8d52"

jobs:
  build:
    name: Compile PHAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # box's git-version reads the tag this workflow ran on

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Download box.phar
        run: |
          curl -sSL -o box.phar "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          echo "${BOX_PHAR_SHA256}  box.phar" | sha256sum -c -

      - name: Compile PHAR
        run: php box.phar compile --no-parallel

      - name: Smoke-test PHAR
        run: |
          php spandrel.phar --version
          php spandrel.phar analyse

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spandrel-phar
          path: spandrel.phar
          retention-days: 7

  publish:
    name: Publish to spandrel-php/spandrel
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.SPANDREL_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.SPANDREL_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Checkout spandrel-src
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spandrel-src
          fetch-depth: 0 # git-log step below walks tag-to-tag history
          persist-credentials: false

      - name: Checkout spandrel-php/spandrel
        # actions/checkout fetches an explicit ref (refs/heads/main) and
        # fails outright if the repo has no commits yet — the state
        # spandrel-php/spandrel starts in before the first release. A plain
        # git clone tolerates that (unborn HEAD on main, ready for the first
        # commit) instead of erroring, so use that here. The embedded
        # credential in the remote URL is also what the auto-commit step
        # below pushes with.
        env:
          BOT_TOKEN: ${{ secrets.SPANDREL_BOT_TOKEN }}
        run: git clone "https://x-access-token:${BOT_TOKEN}@github.com/spandrel-php/spandrel.git" dist

      - name: Download PHAR artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spandrel-phar
          path: dist

      - name: chmod PHAR
        run: chmod 755 dist/spandrel.phar

      - name: Sign PHAR
        working-directory: dist
        env:
          GPG_ID: ${{ steps.import-gpg.outputs.fingerprint }}
        run: gpg --batch --pinentry-mode loopback -u "$GPG_ID" --detach-sign --armor --output spandrel.phar.asc spandrel.phar

      - name: Verify signature
        working-directory: dist
        run: gpg --verify spandrel.phar.asc spandrel.phar

      - name: Export public key
        # Re-written every release (same long-lived key each time) so the
        # dist repo carries the key needed to verify spandrel.phar.asc,
        # without depending on a keyserver being reachable.
        env:
          GPG_ID: ${{ steps.import-gpg.outputs.fingerprint }}
        run: gpg --armor --export "$GPG_ID" > dist/spandrel-bot.gpg.asc

      - name: Publish public key to keys.openpgp.org
        # Supplementary discoverability, not the primary verification path
        # (that's the bundled spandrel-bot.gpg.asc, checked against the
        # fingerprint printed above) — a keyserver hiccup shouldn't fail a
        # release. keys.openpgp.org only publishes non-identity data on a
        # bare send-keys; the email UID stays unsearchable until someone
        # completes its email-verification flow by hand, which CI can't do.
        continue-on-error: true
        env:
          GPG_ID: ${{ steps.import-gpg.outputs.fingerprint }}
        run: gpg --keyserver hkps://keys.openpgp.org --send-keys "$GPG_ID"

      - name: Write wrapper script
        run: |
          cat > dist/spandrel <<'PHP'
          #!/usr/bin/env php
          <?php

          declare(strict_types=1);

          Phar::loadPhar(__DIR__ . '/spandrel.phar', 'spandrel.phar');

          require 'phar://spandrel.phar/bin/spandrel.php';
          PHP
          chmod 755 dist/spandrel

      - name: Write composer.json
        run: |
          cat > dist/composer.json <<'JSON'
          {
              "name": "spandrel/spandrel",
              "description": "Spandrel is a static analysis tool for PHP applications, enforcing architectural rules over a codebase's dependency graph.",
              "license": "AGPL-3.0-or-later",
              "keywords": ["dev", "static analysis", "architecture"],
              "require": {
                  "php": "^8.5"
              },
              "bin": ["spandrel", "spandrel.phar"],
              "support": {
                  "issues": "https://github.com/spandrel-php/spandrel/issues",
                  "source": "https://github.com/spandrel-php/spandrel-src"
              }
          }
          JSON

      - name: Copy LICENSE
        run: cp spandrel-src/LICENSE dist/LICENSE

      - name: Write README
        run: |
          cat > dist/README.md <<MD
          # Spandrel

          This repository holds Spandrel's compiled, release-ready \`spandrel.phar\` —
          the artifact \`composer require spandrel/spandrel\` installs, or that you
          can download and run directly. It is published automatically from
          [spandrel-php/spandrel-src](https://github.com/spandrel-php/spandrel-src),
          where Spandrel's source, issues and pull requests live. See
          [CHANGELOG.md](CHANGELOG.md) for what changed in each release.

          ## Usage

          \`\`\`sh
          composer require --dev spandrel/spandrel
          vendor/bin/spandrel analyse
          \`\`\`

          Or run the PHAR directly:

          \`\`\`sh
          curl -LO https://github.com/spandrel-php/spandrel/raw/${{ github.ref_name }}/spandrel.phar
          php spandrel.phar analyse
          \`\`\`

          Signed with \`spandrel.phar.asc\`. Verify against the bundled public
          key (fingerprint \`${{ steps.import-gpg.outputs.fingerprint }}\`):

          \`\`\`sh
          gpg --import spandrel-bot.gpg.asc
          gpg --verify spandrel.phar.asc spandrel.phar
          \`\`\`

          The same key is also published on
          [keys.openpgp.org](https://keys.openpgp.org), fetchable by
          fingerprint without trusting this repo for the key itself:

          \`\`\`sh
          gpg --keyserver hkps://keys.openpgp.org --recv-keys ${{ steps.import-gpg.outputs.fingerprint }}
          \`\`\`
          MD

      - name: Get git log
        id: git-log
        working-directory: spandrel-src
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          echo "log<<MESSAGE" >> "$GITHUB_OUTPUT"
          git log "$PREVIOUS_TAG"..HEAD --reverse --pretty='- %s ([%h](https://github.com/spandrel-php/spandrel-src/commit/%H))' >> "$GITHUB_OUTPUT"
          echo "MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md
        # Same commit range as the commit message below, reformatted as a
        # dated section prepended to the top of the file (newest first).
        # Entries are one line per source commit — there's no separate
        # curation step, so this is a log, not hand-written release notes.
        working-directory: dist
        env:
          GIT_LOG: ${{ steps.git-log.outputs.log }}
        run: |
          NEW_ENTRY="$(printf '## %s - %s\n\n%s\n' "${{ github.ref_name }}" "$(date -u +%Y-%m-%d)" "$GIT_LOG")"
          # Previous entries, i.e. everything after the "# Changelog" header
          # and its blank line — empty on the very first release.
          PREVIOUS_ENTRIES=""
          if [ -f CHANGELOG.md ]; then
            PREVIOUS_ENTRIES="$(tail -n +3 CHANGELOG.md)"
          fi
          {
            echo "# Changelog"
            echo
            printf '%s\n' "$NEW_ENTRY"
            if [ -n "$PREVIOUS_ENTRIES" ]; then
              echo
              printf '%s\n' "$PREVIOUS_ENTRIES"
            fi
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit and tag
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          repository: dist
          commit_user_name: spandrel-bot
          commit_user_email: spandrel-bot@users.noreply.github.com
          commit_author: spandrel-bot <spandrel-bot@users.noreply.github.com>
          commit_options: "--gpg-sign"
          commit_message: |
            Spandrel ${{ github.ref_name }}

            ${{ steps.git-log.outputs.log }}
          tagging_message: ${{ github.ref_name }}
          # The git clone above already leaves us on the right branch with
          # the right remote — this action's own fetch+checkout is
          # redundant, and specifically breaks on a from-scratch repo (an
          # unqualified `git fetch` errors when the remote has no refs at
          # all, and `git checkout --` with no branch name fails with "You
          # are on a branch yet to be born" against an unborn HEAD). Both
          # only matter before the dist repo's first-ever commit.
          skip_fetch: true
          skip_checkout: true
