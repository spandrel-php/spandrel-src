name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: PHPUnit, PHPStan, Spandrel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # upload-sarif's wait-for-processing polls the workflow-run API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none

      - name: Composer audit
        run: composer audit --locked

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Spandrel
        # Three reports from one run:
        # - console: violations readable in this job's log, no upload needed
        # - github: workflow commands annotating the lines on the PR diff
        # - sarif: the file the upload step below feeds to code scanning
        if: always()
        run: php bin/spandrel.php analyse --report=console --report=github --report=sarif:spandrel.sarif

      - name: Upload SARIF
        # Code scanning uploads are free on public repos but need GitHub
        # Advanced Security (a paid, plan-gated feature) on private ones —
        # skip until this repo goes public, so CI doesn't stay red forever
        # over something that isn't actually broken. continue-on-error is a
        # safety net for any other reason the upload might fail later.
        if: always() && !github.event.repository.private
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: spandrel.sarif

  phar:
    name: "Compile PHAR"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # box.phar release, pinned by checksum — see release.yml for the
      # actual publish pipeline this only rehearses
      BOX_VERSION: "4.7.0"
      BOX_PHAR_SHA256: "3d390eeaec33288098fe83f8a54c60cc575cb6be295f38ff4482b4b4f26f8d52"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # box's git-version needs tag/commit history

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none

      - name: Cache Composer dependencies
        # Caches Composer's download cache, not the installed vendor/ tree —
        # composer install still verifies dist checksums from composer.lock
        # when unpacking a cache hit, whereas a restored vendor/ tree would
        # be trusted as-is by version alone. No restore-keys fallback: a
        # lock-file miss should mean a clean, checksum-verified install, not
        # a stale tree from an unrelated lock file.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts --no-plugins

      - name: Download box.phar
        run: |
          curl -sSL -o box.phar "https://github.com/box-project/box/releases/download/${BOX_VERSION}/box.phar"
          echo "${BOX_PHAR_SHA256}  box.phar" | sha256sum -c -

      - name: Compile PHAR
        run: php box.phar compile --no-parallel

      - name: Smoke-test PHAR
        # Catches box.json/scoper.inc.php breakage (a bad exclude-namespace,
        # a dependency php-scoper can't rewrite cleanly) on every PR instead
        # of first at release time.
        run: |
          php spandrel.phar --version
          php spandrel.phar analyse
