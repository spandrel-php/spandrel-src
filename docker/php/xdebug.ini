[xdebug]
; Default off for performance; override per-run with the XDEBUG_MODE env var,
; e.g. `XDEBUG_MODE=debug,develop docker compose run --rm php ...`
xdebug.mode=off
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=0
xdebug.idekey=VSCODE
